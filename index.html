<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' ; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#f2f2f4">
    <title>Georgian Gems: Heritage and Landscapes</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
    <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
    <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map" tabindex="-1"></div>
    <div id="info-panel" class="hidden" tabindex="-1">
        <div class="sheet-handle"></div>
        <button id="close-btn" aria-label="Close details">&times;</button>
        <div id="info-content">
            <!-- Content will be injected by JavaScript -->
        </div>
    </div>

    <!-- Cinematic Intro Overlay -->
    <!-- Filter Controls -->
    <div id="filter-control" class="filter-control">
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Search..." aria-label="Search sites">
        </div>
        <button class="filter-btn active" data-category="all" aria-pressed="true">All</button>
        <button class="filter-btn" data-category="Cultural" aria-pressed="false">Cultural</button>
        <button class="filter-btn" data-category="Natural" aria-pressed="false">Natural</button>
        <button class="filter-btn" data-category="favorites" aria-pressed="false">Favorites</button>
        <div class="journey-wrapper">
            <button id="journey-btn" type="button" class="filter-btn" aria-haspopup="true" aria-expanded="false">Journeys</button>
            <div id="journey-menu" class="journey-menu" aria-hidden="true">
                <button type="button" class="journey-option" data-journey="royal_path">The Royal Path</button>
                <button type="button" class="journey-option" data-journey="wild_horizons">Wild Horizons</button>
            </div>
        </div>
        <div id="progress-tracker" class="progress-tracker" title="Gems Discovered">
            <svg class="progress-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l5 6-10 12L2 9zM2 9h20M7 3l5 18 5-18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <span id="progress-text">0/12</span>
        </div>
    </div>

    <!-- Cinematic Intro Overlay -->
    <div id="intro-overlay" class="intro-overlay" aria-hidden="false">
        <div class="intro-bg"></div>
        <div class="intro-content">
            <h1 id="intro-title">Georgian Gems</h1>
            <p class="intro-subtitle">Heritage and landscapes of Georgia</p>
            <button id="start-btn" aria-label="Start Exploring">Start Journey</button>
        </div>
    </div>

    <!-- Ambient sound control: opt-in, muting closes the audio entirely -->
    <button id="sound-btn" aria-pressed="false" aria-label="Sound on">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4V5z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
        </svg>
    </button>

    <!-- Reset View Control -->
    <button id="reset-view-btn" aria-label="Reset Map View">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
        </svg>
    </button>

    <script src="gem-sound.js"></script>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vendor/markercluster/leaflet.markercluster.js"></script>
    <script src="script.js"></script>
</body>
</html>
